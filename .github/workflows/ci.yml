name: nexora-validation

on:
  pull_request:
  push:
    branches: [main, "phase/01-foundations", "phase/02-agent-runtime"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Validate Compose
        run: docker compose -f infra/compose.yaml config
      - name: Bootstrap
        run: make bootstrap
      - name: Static validation
        run: make lint && make format-check && make typecheck
      - name: Migration validation
        run: make db-migrate-check
      - name: Unit and contract tests
        run: make test-unit && make test-contract
      - name: Integration tests
        run: make test-integration
      - name: Security tests
        run: make test-security
      # Both phases run the same complete suite. Phase 01 stays an explicit step so
      # a Phase-02 change that breaks the foundation fails under its own name.
      - name: Complete Phase 01 suite
        run: make phase PHASE=01
      - name: Complete Phase 02 suite
        run: make phase PHASE=02
