    requirement_ids: [ARCH-001, ARCH-003]
    level: integration
    type: migration
    command: "make db-migrate-check"
    fixture: "backend/tests/fixtures/foundation/empty-postgres.yaml"
    preconditions: ["empty local PostgreSQL", "fake environment"]
    input: "upgrade to head twice and compare normalized catalog"
    expected_result: "migration head is 0001_foundation and second upgrade has zero drift"
    expected_state: "all required tables, indexes, constraints and grants exist once"
    expected_side_effect: "schema objects only"
    negative_assertion: ["no ad-hoc DDL", "no duplicate object", "no production connection"]
    owner: Nikola
    evidence_path: "artifacts/validation/phase-01/migration-check.log"

