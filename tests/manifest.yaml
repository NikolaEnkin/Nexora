    input: "query tenant A then tenant B on reused connection and guess A object as B"
    expected_result: "B sees only B rows and guessed ID returns non-disclosing denial"
    expected_state: "transaction-local context cleared after each transaction"
    expected_side_effect: "security audit event only"
    negative_assertion: ["no A row", "no A count/metadata", "no inherited actor context"]
    owner: Nikola
